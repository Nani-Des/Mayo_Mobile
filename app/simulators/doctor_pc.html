<!DOCTYPE html>
<html>
<head>
    <title>Doctor Station | Secure Link</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: white; padding: 50px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 30px; border-radius: 16px; width: 420px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #qrcode { background: white; padding: 15px; border-radius: 10px; margin: 20px auto; display: inline-block; }
        .status-ready { color: #00ff88; font-weight: bold; padding: 10px; border: 1px solid #00ff88; border-radius: 5px; margin-top: 15px; display: none; }
        .data-log { background: #000; color: #00ff00; font-family: monospace; font-size: 11px; padding: 15px; text-align: left; border-radius: 8px; margin-top: 20px; display: none; height: 150px; overflow-y: scroll; border: 1px solid #333; }
        .ip-tag { font-size: 12px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #0284c7; margin-bottom: 5px;">Doctor Workstation</h2>
        <p style="color: #888; font-size: 14px;">Scan to establish secure pipe</p>
        
        <div id="qrcode"></div>
        <div id="ip-display" class="ip-tag">Detecting Server...</div>
        
        <div id="status" class="status-ready">✓ DEVICE LINKED</div>
        
        <div id="details" style="display:none; margin-top:15px; text-align: left; font-size: 13px;">
            <p><b>Active Patient ID:</b> <span id="pid"></span></p>
            <p><b>Session Token:</b> <span id="key"></span></p>
        </div>

        <div id="log" class="data-log">> System Ready...</div>
    </div>

    <script>
        const logBox = document.getElementById('log');
        const qrcodeContainer = document.getElementById('qrcode');

        async function initStation() {
            try {
                // 1. Fetch PC IP from Node server
                const response = await fetch('http://localhost:3000/config');
                const config = await response.json();
                document.getElementById('ip-display').innerText = `Station IP: ${config.ip}`;

                // 2. Generate QR for Mobile App to scan
                // Format: JSON with IP and Handshake Info
                const qrData = JSON.stringify({
                    ip: config.ip,
                    token: "MAYOCLINIC_INTERNAL_XYZ",
                    instruction: "CONNECT_STATION"
                });

                new QRCode(qrcodeContainer, {
                    text: qrData,
                    width: 200,
                    height: 200,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

                // 3. Listen for transfers
                setupEventListener(config.ip);

            } catch (err) {
                logBox.style.display = 'block';
                logBox.innerHTML += `<div style="color:red;">! Error: Cannot connect to server.js</div>`;
            }
        }

        function setupEventListener(ip) {
            const eventSource = new EventSource(`http://${ip}:3000/events`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // UI Updates
                qrcodeContainer.style.opacity = "0.3"; // Dim QR once used
                document.getElementById('status').style.display = 'block';
                document.getElementById('details').style.display = 'block';
                logBox.style.display = 'block';

                document.getElementById('pid').innerText = data.patientId;
                document.getElementById('key').innerText = data.sessionToken;

                // Logs
                const time = new Date().toLocaleTimeString();
                logBox.innerHTML += `<div style="color: #aaa;">[${time}] LOG --- USB PIPE DATA RECEIVED ---</div>`;
                logBox.innerHTML += `<div style="color: #00ff00; margin-bottom:10px;">SUCCESS: ${JSON.stringify(data.fullData)}</div>`;
                
                logBox.scrollTop = logBox.scrollHeight;
            };
        }

        initStation();
    </script>
</body>
</html>
